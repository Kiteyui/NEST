- insert:
    - id: nest-discussion-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: nest
        transport: stdio
        command: powershell.exe
        args:
          - -NoLogo
          - -NoProfile
          - -NonInteractive
          - -Command
          - >-
            $server = [IO.Path]::Combine($env:LOCALAPPDATA, 'NEST', 'bin', 'nest-mcp.exe');
            $child = Start-Process -FilePath $server -NoNewWindow -Wait -PassThru -ErrorAction Stop;
            exit $child.ExitCode
